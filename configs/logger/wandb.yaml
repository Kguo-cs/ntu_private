wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  name: ${task_name}
  save_dir: ${paths.output_dir}
  project: bc
  entity: u3006612
  log_model: false
  offline: true
  id: null
  resume: "never"
  group: ""
  tags: []
  job_type: ""
  prefix: ""

  # pass directly to wandb.init()
  settings:
    start_method: thread   # safer with multiprocessing
    mode: offline          # explicit, though offline: true is enough


