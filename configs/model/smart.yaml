_target_: src.smart.model.smart.SMART
model_config:
  optimizer: default  # Select optimizer=scenario_dreamer for the official LDM recipe.
  lr: 0.0005
  lr_warmup_steps: 0
  lr_total_steps: ${trainer.max_epochs}
  lr_min_ratio: 0.05
  n_rollout_closed_val: 32
  n_batch_wosac_metric: 10
  n_vis_batch: 2
  n_vis_scenario: 1
  n_vis_rollout: 5
  val_open_loop: true
  val_closed_loop: true
  token_processor:
    map_token_file: "map_traj_token5.pkl"
    agent_token_file: "agent_vocab_555_s2.pkl" #my2048 #agent_vocab_555_s2
    map_token_sampling: # open-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0 # uniform sampling
    agent_token_sampling: # closed-loop
      num_k: 1 # for k nearest neighbors
      temp: 1.0
  validation_rollout_sampling:
    criterium: topk_prob
    num_k: 5 # for k most likely
    temp: 1.0
  training_rollout_sampling:
    criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
    num_k: -1 # for k nearest neighbors, set to -1 to turn-off closed-loop training
    temp: 1.0
  decoder:
    init_decoder: flow
    sep_map: false  # A trainable map encoder dedicated to supervised InitDiffusion.
    init_diffusion:
      fix_ego: true  # false: generate and supervise ego along with all other agents.
      generate_type: false  # Joint noisy one-hot Flow; requires supervised initial-scene SD evaluation.
      type_loss_weight: 1.0  # Active-agent mean cross entropy in addition to continuous reconstruction.
      pos_source: gaussian  # gaussian or uniform; uniform uses mean +/- sqrt(3)*std per coordinate.
      shape_source: gaussian  # Applies to linear sizes or log sizes according to size_representation.
      velocity_source: gaussian  # Applies to vx/vy or scalar speed according to velocity_representation.
      velocity_representation: vector  # vector: vx/vy; speed: scalar norm, reconstruct using heading.
      speed_loss_weight: 0.0  # Optional normalized magnitude MSE in addition to vector reconstruction.
      speed_loss_scale: null  # m/s; null reuses RMS speed from velocity moments, floored at 1 m/s.
      size_representation: linear  # log: generate log(length/width), exp for physical outputs and collision.
      invalid_size_policy: mask  # Log training: mask missing size labels; error rejects them. Evaluation is strict.
      heading_noise: gaussian  # gaussian: existing linear path; circular: uniform direction + shortest arc.
      heading_objective: x0  # x0 or angular_velocity (requires circular).
      heading_flow_loss_weight: 1.0  # Coefficient of unweighted angular-velocity MSE.
      sigma_h: null  # Positive value: zero-mean isotropic cos/sin noise; null: empirical noise.
      edge_embedding_type: fourier  # Denoiser geometry: fourier or mlp.
      time_embedding_type: legacy  # legacy or scenario_dreamer (256D sin/cos + SiLU MLP).
      time_embedding_scale: 99.0  # SD mode maps continuous Flow t in [0,1] to released indices [0,99].
      count_embedding_type: none  # none or scenario_dreamer (learned integer scene-count embeddings).
      count_lane_source: map_tokens  # map_tokens: prepared SMART inputs; scenario_dreamer: requires sd_map.
      count_max_num_agents: 128  # Inclusive vocabulary limit, counts include ego.
      count_max_num_lanes: 1024  # SMART map tokens differ from SD compact lanes; no silent clipping.
      map_embedding_type: none  # none or scenario_dreamer (scene label = 2*lg_type + map_id).
      map_id_source: fixed  # fixed uses the configured category; metadata requires valid per-scene labels.
      map_id: 0  # Waymo Nocturne category: 0 or 1; used only with map_id_source=fixed.
      map_lg_type: 0  # Full SMART condition map; null requires per-scene lg_type metadata.
      map_label_dropout: 0.1  # SD scene-label dropout in training, shared by agent and map nodes.
      use_ema: false
      ema_decay: 0.9999
    initial_scene_only: false  # Direct initial-state evaluation on full reference lanes.
    scenario_dreamer: null
    vectorworld: null
    hidden_dim: 128
    num_freq_bands: 64
    num_heads: 8
    head_dim: 16
    dropout: 0.1
    hist_drop_prob: 0.1
    num_map_layers: 3
    num_agent_layers: 6
    pl2pl_radius: 10
    pl2a_radius: 30
    a2a_radius: 60
    time_span: 30
    num_historical_steps: 11
    num_future_steps: 80
  wosac_submission:
    is_active: false
    method_name: "SMART-tiny-CLSFT"
    authors: [Anonymous]
    affiliation: YOUR_AFFILIATION
    description: YOUR_DESCRIPTION
    method_link: YOUR_METHOD_LINK
    account_name: YOUR_ACCOUNT_NAME
  training_loss:
    use_gt_raw: true
    gt_thresh_scale_length: -1.0  # {"veh": 4.8, "cyc": 2.0, "ped": 1.0}
    label_smoothing: 0.1
    rollout_as_gt: false
  finetune: false
