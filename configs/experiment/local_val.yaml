# @package _global_

defaults:
  - override /model: smart_iq

model:
  model_config:
    n_vis_batch: 0
    n_vis_scenario: 0
    n_vis_rollout: 0
    n_batch_wosac_metric: 100000
    val_open_loop: false
    val_closed_loop: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 #64 # for k most likely
      temp: 1.0

ckpt_path:  './waymo_data/epoch=6-step=22428.ckpt'#'/home/ke/code/catk/src/waymo_data/AIRL152_lcf336_val40_learmmap_epoch=10-step=35244_0.78739.ckpt'

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  check_val_every_n_epoch: 1

data:
  train_batch_size: 16
  val_batch_size: 64
  test_batch_size: 16
  num_workers: 8

action: validate