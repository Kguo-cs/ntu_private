# @package _global_

defaults:
  - override /model: smart_fast

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      pred_init: True
      learn_init: True

    finetune: true
    decoder:
      dis_a2a_radius: 10
      dis_a2a_neighbor: 20
      dis_weight: 20
      dist_decay: 3
    #n_batch_wosac_metric: 0

ckpt_path: "./waymo_data/xflow512_n30.ckpt"

task_name: all128_N30_ref_gp0001shape10_loss01clip01 #loss001_clip001decay__noref_dis1e5 #999 #Z_Newz #rewardNewMyexp01d2_l1 #ppo001loss01kl01_clip01ppow01kl001 # samplelossPos #_nocol #_large0shape10noshape10_exp_

trainer:
  val_check_interval: 0.5
  #val_check_interval: 0.000002
  max_epochs: 10
  gradient_clip_val: 0.0

data:
  train_batch_size: 128 #6
  val_batch_size: 256

action: finetune
