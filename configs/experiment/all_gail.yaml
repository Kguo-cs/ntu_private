# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: True
      learn_autoencoder: False

    val_open_loop: False
    finetune: true
    smart : false
    n_rollout_closed_val: 8
    decoder:
      hist_drop_prob: 0 #0.1 #0.1
     # dropout: 0.1

      dis_a2a_radius: 60
      dis_a2a_neighbor: 20

      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5

#ckpt_path: './waymo_data/xflow256_map100_rellane_epoch=11-step=22836.ckpt'
ckpt_path: './waymo_data/flow_xpred_egorel_mse_epoch=63-step=121792.ckpt'
#ckpt_path: '/home/ke/code/sim/src/logs/flow_normscale_vpred_nomatch_rotateout/2026-05-01_14-14-27/bc/ww97393s/checkpoints/last.ckpt'

task_name: AIRL22_sde001_meanstd #_noisepre #_first5 #_dis1e2_clip_policy0 #10 #_flow_sde_eval #mean

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  #check_val_every_n_epoch: 1
  val_check_interval: 0.2
  #val_check_interval: 0.000002
  max_epochs: 5
  gradient_clip_val: 0.0

data:
  train_batch_size: 22
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8

#action: validate
action: finetune
