# @package _global_
# Full run: cc_road_k8_match (wandb nnsjk5vl) with every agent attending to all map tokens of
# the 50 m crop (map2agent_max_num_neighbors 30 -> 64; ~52 tokens/scene). No extra parameters.
# Evidence:
#   nnsjk5vl (last 3 vals vs iu3fa4gx): speed .035 (-38%), ang .040 (+2%), length .275 (+2%),
#     best speed/ang/length average of all full runs; weakness lat .0055 (cc_best: .0032).
#   map2agent 64 in paired warm-start finetunes (2 seeds, cc_best recipe): lat and speed JSD
#     improved, other JSDs neutral; cc_best (map 64) has the best lat of the full runs.
defaults:
  - cc_road_k8_match
  - _self_

task_name: cc_road_k8_match_map64

model:
  model_config:
    decoder:
      init_diffusion:
        map2agent_max_num_neighbors: 64
