# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: False
      learn_autoencoder: False

    val_open_loop: False
    finetune: true
    smart : false
    decoder:
      hist_drop_prob: 0 #0.1 #0.1
     # dropout: 0.1

      dis_a2a_radius: 60
      dis_a2a_neighbor: 20

      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5

#ckpt_path : './ckpts/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'
ckpt_path: './waymo_data/xflow256_msesq_scedule5_nolog_epoch=63-step=121792.ckpt'
#ckpt_path: '/home/ke/code/sim/src/waymo_data/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'

task_name: model20_bclen10_mean_r101 #01 #_meanweight #_gp #_noise01001_nodecompdiff #_noise1e2 #_grad_dis5e5


trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
 # check_val_every_n_epoch: 1
  val_check_interval: 0.25
  #val_check_interval: 0.000002
  max_epochs: 5
  gradient_clip_val: 0.0

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null     # or any directory you prefer
  filename: "epoch={epoch}-valmeta={val_closed/wosac_likelihood/metametric:.4f}"
  monitor: "val_closed/wosac_likelihood/metametric"   # <== key metric from validation
  verbose: false
  save_last: true
  save_top_k: 3
  mode: "max"                          # "max" since your metric increases with performance
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: false       # <== important, disables save after training epoch


data:
  train_batch_size: 20 #6
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8

#action: validate
action: finetune
# nohup python run.py > 1.txt 2>&1 &
