# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: False
      learn_autoencoder: False

    val_open_loop: False
    finetune: true
    smart : false
    decoder:
      hist_drop_prob: 0 #0.1 #0.1
     # dropout: 0.1

      dis_a2a_radius: 60
      dis_a2a_neighbor: 20

      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5

#ckpt_path : './ckpts/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'
ckpt_path: './waymo_data/xflow256_msesq_scedule5_nolog_epoch=63-step=121792.ckpt'
#ckpt_path: './waymo_data/xflow256_val4_epoch=63-step=121792.ckpt'

task_name: model22_t10_gp8_logitgp01_len18 #_decay103 #_initfeat_01nll_disa10 #_mean #_Sumpos_max100_gp001@all_fix #_expertall #_disr10plr10 #_01ppovalue1e3_nodec #_bclen1001_ppo01value03 #01 #_meanweight #_gp #_noise01001_nodecompdiff #_noise1e2 #_grad_dis5e5


trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
 # check_val_every_n_epoch: 1
  val_check_interval: 0.25
  #val_check_interval: 0.000002
  max_epochs: 5
  gradient_clip_val: 0.0



data:
  train_batch_size: 22 #6
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8

#action: validate
action: finetune
