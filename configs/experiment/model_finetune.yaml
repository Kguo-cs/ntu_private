# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_fast

model:
  model_config:
    lr: 0 #1e-4
    lr_min_ratio: 0.05
    token_processor:
      pred_init: True

    finetune: true
    decoder:
      dis_a2a_radius: 10
      dis_a2a_neighbor: 20
      dis_weight: 20
      dist_decay: 3

#ckpt_path : './ckpts/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'
