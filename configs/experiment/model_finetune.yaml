ckpt_path: "./waymo_data/xflow256_val64_epoch=57-step=110374-valmeta=0.6447.ckpt"

task_name: model32_valuedetach_gp01_dis5e5

trainer:
  #val_check_interval: 0.25
  val_check_interval: 0.000002
  max_epochs: 5
  gradient_clip_val: 0.0

data:
  train_batch_size: 32 #6
  val_batch_size: 256

action: validate
