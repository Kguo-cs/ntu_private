# @package _global_
# Verified short-training recipe evidence; no128epoch final-result claim.
# FreshG1/optimizer/EMA; fixed AIRL map; TRAIN8192 calibration; epoch shuffle enabled.
# Use optimizer=default in the run command; optimizer groups are applied after experiments.
# Seven native metrics; final R needs matched128epoch/50k/TRAIN-GEN baseline supplied explicitly.
defaults:
- init_diffusion_657_full_base
- _self_
task_name: init_diffusion_657_n20_a2a_k8
action: fit
ckpt_path: null
seed: 4817
float32_matmul_precision: medium
model:
  _target_: src.smart.model.smart_gail.SMART_GAIL
  model_config:
    sd_r_reference: null
    initial_map_checkpoint: ${sim_root:}/src/waymo_data/AIRL32_interdis_mean_203_disnodiff_nonego_epoch=9-step=152190_0.79036.ckpt
    optimizer: default
    lr: 0.0005
    lr_warmup_steps: 0
    lr_total_steps: 128
    lr_min_ratio: 0.05
    n_rollout_closed_val: 32
    n_batch_wosac_metric: 1
    n_vis_batch: 0
    n_vis_scenario: 40
    n_vis_rollout: 32
    val_open_loop: false
    val_closed_loop: true
    token_processor:
      init_map_crop: square
      init_map_half_extent: 50.0
      map_token_file: map_traj_token5.pkl
      agent_token_file: agent_vocab_555_s2.pkl
      map_token_sampling:
        num_k: 1
        temp: 1.0
      agent_token_sampling:
        num_k: 1
        temp: 1.0
      pred_init: true
      learn_init: true
      learn_autoencoder: false
      scenario_dreamer_init: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 5
      temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob
      num_k: -1
      temp: 1.0
    decoder:
      init_decoder: flow
      sep_map: false
      init_diffusion:
        component_loss:
          normalize_time_weights: true
          std_floor: 0.1
          heading_space: angle
          components:
            position:
              kind: l1
              time_power: 1
              weight: 4.0
              scale: data
            heading:
              kind: mse
              time_power: 2
              weight: 1.0
              scale: none
            length:
              kind: mse
              time_power: 1
              weight: 1.0
              scale: data
            width:
              kind: mse
              time_power: 2
              weight: 1.0
              scale: data
            velocity:
              kind: mse
              time_power: 1
              weight: 2.0
              scale: data
            type:
              kind: ce
              time_power: 0
              weight: 1.0
              scale: none
            collision:
              kind: l1
              time_power: 1
              weight: 5.0
              scale: none
            speed_magnitude:
              kind: mse
              time_power: 0
              weight: 0.0
              scale: data
        normalizer_path: ${sim_root:}/docs/experiments/init_diffusion_scratch_loss_search_20261011/train_normalizer.json
        denoiser_hidden_dim: 256
        denoiser_num_layers: 3
        sampling_steps: 20
        collision_reduction: pair_mean
        time_conditioning: every_layer
        a2a_radius: 300.0
        a2a_max_num_neighbors: 8
        map2agent_radius: 300.0
        map2agent_max_num_neighbors: 30
        state_feature_normalization: train
        speed_x0_parameterization: identity
        speed_head_kind: shared
        speed_head_detach_context: false
        matching_weights: null
        time_sample_power: 1.0
        distribution_loss: null
        map_condition_types: road_edges
        fix_ego: false
        fix_ego_position: true
        fix_ego_heading: true
        fix_ego_shape: true
        fix_ego_velocity: false
        fix_ego_type: true
        use_ego_embedding: true
        ego_context_heading_encoding: angle
        generate_type: true
        type_loss_weight: 1.0
        type_process: separate
        type_match_weight: 1.0
        type_noise_stats: standard
        type_noise_std_floor: 0.01
        pos_source: gaussian
        shape_source: gaussian
        velocity_source: gaussian
        velocity_representation: speed
        speed_loss_weight: 0.0
        speed_loss_scale: null
        size_representation: linear
        invalid_size_policy: mask
        heading_noise: circular
        heading_objective: x0
        heading_x0_loss: vector_mse
        heading_flow_loss_weight: 1.0
        sigma_h: 5.0
        edge_embedding_type: fourier
        time_embedding_type: scenario_dreamer
        time_embedding_scale: 99.0
        count_embedding_type: none
        count_lane_source: map_tokens
        count_max_num_agents: 128
        count_max_num_lanes: 1024
        map_embedding_type: none
        map_id_source: fixed
        map_id: 0
        map_lg_type: 0
        map_label_dropout: 0.1
        use_ema: true
        ema_decay: 0.9999
      initial_scene_only: true
      scenario_dreamer: null
      vectorworld: null
      hidden_dim: 128
      num_freq_bands: 64
      num_heads: 8
      head_dim: 16
      dropout: 0
      hist_drop_prob: 0
      num_map_layers: 1
      num_agent_layers: 3
      pl2pl_radius: 20
      pl2a_radius: 40
      a2a_radius: 60
      time_span: 60
      num_historical_steps: 11
      num_future_steps: 80
      pt2pt_neighbor: 30
      pt2a_neighbor: 20
      a2a_neighbor: 20
      dis_a2a_radius: 0
      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5
    wosac_submission:
      is_active: false
      method_name: SMART-tiny-CLSFT
      authors:
      - Anonymous
      affiliation: YOUR_AFFILIATION
      description: YOUR_DESCRIPTION
      method_link: YOUR_METHOD_LINK
      account_name: YOUR_ACCOUNT_NAME
    training_loss:
      use_gt_raw: true
      gt_thresh_scale_length: -1.0
      label_smoothing: 0.1
      rollout_as_gt: false
    finetune: true
    sd_use_cached_evaluator: true
    sd_eval_set: ${sim_root:}/src/waymo_data/waymo_eval_set.pkl
    sd_real_cache: ${sim_root:}/src/waymo_data/sd_real_metric_cache.sqlite
    sd_expected_scenes: 50000
    sd_gen_timestep: 0
    sd_prediction_frame: world
    sd_require_generation_timestep: true
    sd_reference_mode: matched
    sd_require_full_set: false
data:
  train_batch_size: 512
  val_batch_size: 128
  test_batch_size: 128
  train_raw_dir: ${sim_root:}/src/waymo_data/full/training_map2_sd
  val_raw_dir: ${sim_root:}/src/waymo_data/full/scenario_dreamer_val
  test_raw_dir: ${sim_root:}/src/waymo_data/full/scenario_dreamer_val
  val_tfrecords_splitted: null
  scenario_dreamer_preprocessed: false
  scenario_dreamer_train_non_partitioned_only: false
  scenario_dreamer_train_latent_cache: null
  scenario_dreamer_val_latent_cache: null
  scenario_dreamer_test_latent_cache: null
  shuffle: true
  scenario_dreamer_train_sample_list: null
  scenario_dreamer_eval_set: null
  num_workers: 0
  pin_memory: false
  persistent_workers: false
trainer:
  max_epochs: 128
  max_steps: -1
  precision: 32-true
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
