# @package _global_
# Current full-training candidate: road-edge K8, not lanes_and_edges.
# W&B zww9tc6r epoch55: speed=.02361, ang=.05075, length=.25767.
# Source config uses full validation; W&B JSON1 alone cannot distinguish1 from1.0.
# Keep the existing loss; validate the complete official50k scene set.
defaults:
  - init_diffusion_657_n20_a2a_k8
  - init_diffusion_657_jsd_monitoring
  - _self_

task_name: init_diffusion_657_n20_road_k8_full
action: fit
ckpt_path: null
seed: 4817

model:
  model_config:
    sd_r_reference: ${sim_root:}/configs/metrics/iu3fa4gx_full50000.json
    sd_expected_scenes: 50000
    sd_require_full_set: true
    sd_reference_mode: matched
    decoder:
      init_diffusion:
        map_condition_types: road_edges
        sampling_steps: 20
        denoiser_hidden_dim: 256
        denoiser_num_layers: 3
        a2a_max_num_neighbors: 8
        map2agent_max_num_neighbors: 30
        collision_reduction: pair_mean

data:
  train_batch_size: 512
  val_batch_size: 128
  test_batch_size: 128
  num_workers: 8

trainer:
  max_epochs: 128
  limit_train_batches: 1.0
  val_check_interval: 1.0
  limit_val_batches: 1.0
  check_val_every_n_epoch: 8
  limit_test_batches: 1.0
