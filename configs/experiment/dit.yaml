task_name: dit128_airl_tn0_N #_sharesort #_fullcluster_randinit  #_noclip_nomean ##@_scale1_maxN_paddingZ # _trainLin #Same_col00_onestep_imf  #ganlogit1_r60_norp_lr_sepa2a_step1 #_detach_exp10_match_airlgan_weight1diff_decomp #inter_nopg_r10_dec2000_graphmatch_5e2_OBBexp_inner10 #_val0_dit512l1 #colcircleexp10 #circle #obb #_pos1 #@_cos #_beta05 #_learnmapall #_heun_statescalel1 # #l1  #latentRand_#_match_roformer1power2 #gan512 #_pos2xloss_ganstep10 #09 #_matchl1pos1h1v1 #matchonlyweightMse #_gan50 #_initloss_tsamll01 #roformer50 #drop0 #roformerPosmode1step50gangan1big05_step50 #rofromer_gan_step15e4_inter5 #loss09_inter5 #_clip #gan128_ego_shape0 #_ #p01_shape002 #dit128_gan #_inter5_gp01  #noclip_match #_n3 #headv05only # #dit128_noclip21_n20 #ego_eval27

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  #val_check_interval: 0.1
 # val_check_interval: 0.0000002
  max_epochs: 32
  gradient_clip_val: 0.0

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null     # or any directory you prefer
  filename: "epoch={epoch}-valmeta={val_closed/wosac_likelihood/metametric:.4f}"
  monitor: "val_closed/wosac_likelihood/metametric"   # <== key metric from validation
  verbose: false
  save_last: true
  save_top_k: 3
  mode: "max"                          # "max" since your metric increases with performance
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: false       # <== important, disables save after training epoch

data:
  train_batch_size: 128
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8
  train_raw_dir: ${paths.cache_root}/training_map2_init10_light #03_light #all training_map2_03_light,training_map2_03_token: 486995

#action: validate

action: finetune
