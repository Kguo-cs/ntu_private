# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: True
      learn_autoencoder: False


    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    #val_closed_loop: False
    finetune: true
    smart: false
    n_batch_wosac_metric: 0
#    n_vis_batch: 1
#    n_vis_scenario: 32
#    n_vis_rollout: 1

ckpt_path: './ckpts/bcgen56_vel2_epoch=31-step=278304_0.78179.ckpt'

#ckpt_path: './waymo_data/gen256_val256_std_w2_drop0_kl02epoch=31-step=60896.ckpt'
#ckpt_path: './logs/gen128_val256_automap_kl02/2026-01-17_10-19-56/bc/vpblv7bo/checkpoints/epoch=31-step=121760.ckpt'
#ckpt_path: './logs/auto64_val256_l2l_kl02_egomap_nodownsmaple/2026-01-17_22-01-40/bc/rke1kj6i/checkpoints/epoch=31-step=243520.ckpt'

task_name: driectxflow128_step50 #_mean1 #conditionl2l_dit #realcol #_nolatent l2l_egoaddmapl2lautocondit_kl02fix_addn_condition #val256_automap_kl03 #_std_w2_drop0_meankl03_latent #trans2drop01 #_latent16 #_trans2drop01 #_nonan_train10 #_nopos_ #latent #w2_train10_test10_val1 #_mu #_std #_newrange #val256_sort_xpredflow_newrange #_tsample08 #weight_coun #auto__diff_meanstdsortsum1_gpgenr12_1e5_vel_pre #_diff_meanstd_val256_sortsum #gpgenr12_1e5_vel_pre_decomp #norp_shapehead0 #_olddis_match10 #05 #_d2pre__rodecoder216pre #_catnocausa_decaymatch  #_notantransdrop0_all #_graphpla_match02trans2decompmean_ar10 #_decayshape05 #r12_graphdisdecay_adam0value80pi__nomatch #r1r2shape15 #_matchpos2100valuetrans__dispos_ego_notime #angle_graphtime_graphreal_gp100_disdrop01eval2 #_l2 #_w10 #_match #_headmask08_map100_max_01loss_nooffset_ego

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  #val_check_interval: 0.1
  #val_check_interval: 0.0000002
  max_epochs: 32
  #gradient_clip_val: 0.0

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null     # or any directory you prefer
  filename: "epoch={epoch}-valmeta={val_closed/wosac_likelihood/metametric:.4f}"
  monitor: "val_closed/wosac_likelihood/metametric"   # <== key metric from validation
  verbose: false
  save_last: true
  save_top_k: 3
  mode: "max"                          # "max" since your metric increases with performance
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: false       # <== important, disables save after training epoch

data:
  train_batch_size: 128
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8

#action: validate
action: finetune
