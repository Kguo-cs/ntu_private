# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: True
      learn_autoencoder: False


    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    finetune: true
    smart: false
   # n_batch_wosac_metric: 0
#    n_vis_batch: 1
#    n_vis_scenario: 32
#    n_vis_rollout: 2

#ckpt_path: './waymo_data/AIRL32_interdis_mean_203_disnodiff_nonego_epoch=9-step=152190_0.79036.ckpt'

ckpt_path: './waymo_data/dit256_sample20_l2_norm_epoch=59-step=114180.ckpt'

#ckpt_path: "./waymo_data/AIRL19_103_disdiff_nonego_all_start1_noise_epoch=5-step=153792.ckpt"
#ckpt_path: "./waymo_data/dit256_sample10_l2_noise_epoch=63-step=121792.ckpt"


task_name: dit256_sample20_idx_eval #runmean3 #_gamma1_match_vel

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 2
  #val_check_interval: 0.1
  #val_check_interval: 0.0000002
  max_epochs: 64
  gradient_clip_val: 0.0

model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null     # or any directory you prefer
  filename: "epoch={epoch}-valmeta={val_closed/wosac_likelihood/metametric:.4f}"
  monitor: "val_closed/wosac_likelihood/metametric"   # <== key metric from validation
  verbose: false
  save_last: true
  save_top_k: 3
  mode: "max"                          # "max" since your metric increases with performance
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: false       # <== important, disables save after training epoch

data:
  train_batch_size: 256
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 1
#  train_raw_dir: ${paths.cache_root}/training_map2_init0_light #init0_light #all_light #init10_inter
  #train_raw_dir: ${paths.cache_root}/training_lane_init10_light #init10_light #03_light #all training_map2_03_light,training_map2_03_token: 486995
  #val_raw_dir: ${paths.cache_root}/validation_lane #44097

action: finetune