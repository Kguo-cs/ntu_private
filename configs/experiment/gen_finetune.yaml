# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: False
      learn_autoencoder: False

    val_open_loop: False
    finetune: true
    smart : false
    n_rollout_closed_val: 8
    decoder:
      hist_drop_prob: 0 #0.1 #0.1
     # dropout: 0.1

      dis_a2a_radius: 60
      dis_a2a_neighbor: 20

      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5

#ckpt_path : './ckpts/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'
ckpt_path: './waymo_data/dit256_noscale.ckpt'
#ckpt_path: '/home/ke/code/sim/src/waymo_data/bc40_inter1_hist0_t3_epoch=31-step=389600.ckpt'


task_name: AIRL24_1e4_ALL #_fine5_1_nodis0_l4_nonego #_t3_no_R #__nodiffmean #_R #_pre0 #_mean_weight1 #_noshare2_hist01 # #_start2 #_Noexit_mean_sepedge #_hist01oldinteredgetokenoldiqlearn_nodetach_START_dis_LOGIT #_newreward


logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    name: ${task_name}
    save_dir: "${paths.output_dir}"
    offline: False
    id: null # pass correct id to resume experiment!
    anonymous: null # enable anonymous logging
    project: sim
    log_model: False # upload lightning ckpts
    prefix: "" # a string to put at the beginning of metric keys
    entity: u3006612
    group: ""
    tags: []
    job_type: ""
    resume: allow

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  val_check_interval: 0.05
  #val_check_interval: 0.000002
  max_epochs: 10
  gradient_clip_val: 0.0

data:
  train_batch_size: 24 #6
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8

#action: validate
action: finetune
# nohup python run.py > 1.txt 2>&1 &
