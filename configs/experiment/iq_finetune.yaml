# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    #val_closed_loop: False
    finetune: true
    smart : false
    decoder:
      hist_drop_prob: 0 #0.1 #0.1

ckpt_path : './ckpts/bc56_pt30_14679_notokenmask_goal32_epoch=31-valmeta=0.7832.ckpt'

logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    name: ${task_name}
    save_dir: "${paths.output_dir}"
    offline: False
    id: null # pass correct id to resume experiment!
    anonymous: null # enable anonymous logging
    project: sim
    log_model: False # upload lightning ckpts
    prefix: "" # a string to put at the beginning of metric keys
    entity: u3006612
    group: ""
    tags: []
    job_type: ""
    resume: allow

task_name: AIRL152_predrollout_355_goalpolicy

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  #val_check_interval: 0.5
  #val_check_interval: 0.000002
  max_epochs: 16
  gradient_clip_val: 0.0

data:
  train_batch_size: 38
  val_batch_size: 40
  test_batch_size: 10
  num_workers: 16

#action: validate
action: finetune
# nohup python run.py > 1.txt 2>&1 &
