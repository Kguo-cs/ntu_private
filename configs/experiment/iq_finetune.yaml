# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    #val_closed_loop: False
    finetune: true

ckpt_path : './logs/AIRL80_lcf336_val40_learnmap/2025-09-19_09-51-32/sim/yoiayy5f/checkpoints/last.ckpt' #'./ckpts/bc_map2_gnntype_drop01_t1_b40_epoch=58-step=718325_0.78605.ckpt' #'./ckpts/bc_map2_drop01_t1_b40_epoch=56-step=693975_0.78457.ckpt' #'./ckpts/bc32_l3_adamw_histdrop01_a20_epoch=26-step=410913-val_closed_wosac=0.7856.ckpt'

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  #val_check_interval: 0.1
  #val_check_interval: 0.000002
  max_epochs: 16
  gradient_clip_val: 0.0

data:
  train_batch_size: 80
  val_batch_size: 40
  test_batch_size: 10
  num_workers: 28

#action: validate
action: finetune
# nohup python run.py > 1.txt 2>&1 &
