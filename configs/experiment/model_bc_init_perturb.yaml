# @package _global_

defaults:
  - override /model: smart_fast

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      pred_init: True

    finetune: true

ckpt_path: "./waymo_data/xflow512_n30.ckpt"

task_name: model40_perturb #less

trainer:
#  check_val_every_n_epoch: 2
  max_epochs: 16

data:
  train_batch_size: 40 #6
  val_batch_size: 256
  train_raw_dir: ${paths.cache_root}/training_map2_a_light

action: finetune
