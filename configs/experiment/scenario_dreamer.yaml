# @package _global_
defaults:
  - override /model: smart_fast

action: fit
seed: 0
ckpt_path: null  # SMART resume checkpoint; official weights belong to init_decoder below.
task_name: scenario_dreamer_noema

paths:
  root_dir: ${sim_root:}
  cache_root: ${paths.root_dir}/src/waymo_data/scenario_dreamer_ae_preprocess_waymo

model:
  model_config:
    finetune: true
#    lr: 0.0001
#    n_vis_batch: 0
#    n_batch_wosac_metric: 0
#    val_open_loop: false
#    val_closed_loop: true
    token_processor:
      pred_init: true
      learn_init: true
      scenario_dreamer_init: true
    decoder:
      init_decoder: scenario_dreamer
      scenario_dreamer:
        training_stage: ldm  # Use experiment=scenario_dreamer_ae to train the autoencoder.
        ae_config: null
        ae_checkpoint: ${paths.root_dir}/src/waymo_data/scenario_dreamer/checkpoints/scenario_dreamer_autoencoder_waymo/last.ckpt
        ldm_checkpoint: null  # Train LDM from scratch; set a path to load official LDM + EMA weights.
        ldm_config: null  # Optional model/dataset/train overrides for scratch training.
        generation_mode: initial_scene  # Joint lane/agent sampling; metrics use the generated map.
        map_source: exact  # Exact training inputs; joint inference uses their scene counts.
        map_id: 0
        use_ema: false #true
    sd_use_cached_evaluator: true
    sd_eval_set: ${paths.root_dir}/src/waymo_data/waymo_eval_set.pkl
    sd_real_cache: ${paths.root_dir}/src/waymo_data/sd_real_metric_cache.sqlite
    sd_expected_scenes: 50000
    sd_gen_timestep: 0
    sd_prediction_frame: sd_local
    sd_require_generation_timestep: true
    sd_require_full_set: false
    sd_reference_mode: full

data:
  scenario_dreamer_preprocessed: true
  scenario_dreamer_train_latent_cache: null  # Directory produced by action=cache_latents.
  scenario_dreamer_val_latent_cache: null
  scenario_dreamer_test_latent_cache: null
  scenario_dreamer_eval_set: ${model.model_config.sd_eval_set}
  val_tfrecords_splitted: null
  train_raw_dir: ${paths.cache_root}/train
  val_raw_dir: ${paths.cache_root}/test
  test_raw_dir: ${paths.cache_root}/test
  train_batch_size: 40
  val_batch_size: 256
  test_batch_size: 12
  num_workers: 12

trainer:
  devices: 1
  limit_val_batches: 1
  limit_test_batches: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  #val_check_interval: 0.000002 #1.0

callbacks:
  model_checkpoint:
    monitor: collision_rate
    mode: min
    filename: scenario_dreamer-{epoch}-{step}
  model_summary:
    max_depth: 2
