# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0

ckpt_path: null #/home/ke/code/catk/src/logs/epoch=0-step=6581-val_closed_wosac=0.7126.ckpt #./ckpts/epoch=2-step=41744-val_closed_wosac=0.7528.ckpt #/home/ke/code/catk/src/logs/epoch=0-step=3478-val_closed_wosac=0.6567.ckpt #./ckpts/epoch=6-step=86460-val_closed_wosac=0.7533.ckpt #./ckpts/epoch=5-step=68684-val_closed_wosac=0.7437.ckpt #./ckpts/epoch=3-step=45650-val_closed_wosac=0.7437.ckpt #./ckpts/epoch=1-step=18261-val_closed_wosac=0.7403.ckpt #'./ckpts/epoch=6-step=85210-val_closed_wosac=0.7563.ckpt'#'./ckpts/epoch=10-step=133900-val_closed_wosac=0.7516.ckpt'  #'./ckpts/epoch=10-step=133900-val_closed_wosac=0.7516.ckpt' #null # #/home/ke/code/catk/src/logs/epoch_002.ckptnull #

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  val_check_interval: 0.125
  max_epochs: 16
#  gradient_clip_val: 0

data:
  train_batch_size: 36
  val_batch_size: 32
  test_batch_size: 10
  num_workers: 28

