# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    #val_closed_loop: False

#ckpt_path: './logs/bc_shareaptemp100_pt10_layer24_route10/2025-05-22_22-19-01/sim/ajf1dx68/checkpoints/epoch=25-step=49478-acc=0.8085.ckpt'
#ckpt_path: './logs/bc_shareaptemp100_pt10_layer24/2025-05-22_22-16-02/sim/klso3md5/checkpoints/epoch=35-step=54792-acc=0.8071.ckpt'
# ckpt_path: './waymo_data/epoch=35-step=58976-acc=0.8073.ckpt'
#ckpt_path : './ckpts/bc64_pt20_map_epoch=19-step=152200-val_closed_wosac=0.7689.ckpt'

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
#  val_check_interval: 0.00002
  max_epochs: 32
 # gradient_clip_val: 0.0

data: 
  train_batch_size: 64
  val_batch_size: 32
  test_batch_size: 10
  num_workers: 32

