# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
      pred_entry: False
      pred_init: True
      learn_init: False
      learn_autoencoder: False

    val_open_loop: False
    finetune: true
    smart : false
    n_rollout_closed_val: 8
    decoder:
      hist_drop_prob: 0 #0.1 #0.1
     # dropout: 0.1

      dis_a2a_radius: 0
      dis_a2a_neighbor: 20

      dis_weight: 20
      dist_decay: 3
      reward_weight: 0
      reward_decay: 2.5


ckpt_path: './waymo_data/dit256_l3_egotraj3_nosde_epoch=63-step=121792.ckpt'

task_name: init60_noise002

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  #check_val_every_n_epoch: 1
  #val_check_interval: 0.2
  #val_check_interval: 0.000002
  max_epochs: 16
  gradient_clip_val: 0.0

data:
  train_batch_size: 60 #6
  val_batch_size: 256
  test_batch_size: 10
  num_workers: 8
  train_raw_dir: ${paths.cache_root}/training_map2_a_light #init0_light #all_light #init10_inter

#action: validate
action: finetune
# nohup python run.py > 1.txt 2>&1 &
