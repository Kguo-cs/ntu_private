# @package _global_

defaults:
  - override /model: smart_fast

model:
  model_config:
    lr: 1e-4
    lr_min_ratio: 0.05
    token_processor:
      pred_init: True

    finetune: true
    decoder:
      dis_a2a_radius: 10
      dis_weight: 20
      dist_decay:  3

ckpt_path: "./waymo_data/bc_init64_n30_epoch=15-step=121760-valmeta=0.6495.ckpt"

task_name: model32_edge001_heunn #_10_clip #z #intergp001 #_w1 #_dise5 #_min1

trainer:
  val_check_interval: 0.25
  #val_check_interval: 0.000002
  max_epochs: 5
  gradient_clip_val: 0.0

data:
  train_batch_size: 32 #6
  val_batch_size: 256
 # #num_workers: 1

action: finetune
