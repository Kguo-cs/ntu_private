# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      agent_token_file: "bird5.pkl" #my2048 #agent_vocab_555_s2
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    training_rollout_sampling:
      criterium: topk_prob # {topk_dist_sampled_with_prob, topk_prob, topk_prob_sampled_with_dist}
      num_k: 2048 # for k nearest neighbors, set to -1 to turn-off closed-loop training
      temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 # for k most likely
      temp: 1.0
    val_open_loop: False
    #val_closed_loop: False
    #finetune: true
    smart: false
    bird: true
    n_batch_wosac_metric: 0
    n_vis_batch: 0
    n_rollout_closed_val: 16
    decoder:
      num_historical_steps: 6
      num_future_steps: 805 #800
      num_agent_layers: 1
      pl2a_radius: 100
      a2a_radius: 100
      a2a_neighbor: 5
      hidden_dim: 64
      num_freq_bands: 32
      num_heads: 8
      head_dim: 8


#ckpt_path : '/home/ke/code/catk/src/logs/bird_alla2a10_token1/2025-10-26_23-10-14/bird/8zfoz8dk/checkpoints/last.ckpt'

task_name: bird_alla2a5_hist6_val16_metric



trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  #val_check_interval: 0.5
  #val_check_interval: 0.0000002
  max_epochs: 64
  #gradient_clip_val: 0.0

data:
  train_batch_size: 4
  val_batch_size: 8
  test_batch_size: 10
  num_workers: 1
  train_raw_dir: ${paths.cache_root}/bird_all #rawboth #_route #_03nuplan_cross2_03_map #training_map2_03_route #training_map2_03_pred #training_map2_03_pred #training_smart_highest #_raw #clean #training_map2_clean  #training_map2_2049 #training_inter10_raw_light  #training_map2_2049  #_inter10_2049high #map10_2049 #raw_light #2049high #raw_light #2049 #$high #a91 #v #_8192 #v #light_col #a91 #_a91_ligh_light_lightlight_
  val_raw_dir: ${paths.cache_root}/bird_val8 #_map2 #validation_map2 #validation_light #validation_map2

logger:
  wandb:
     _target_: lightning.pytorch.loggers.wandb.WandbLogger
     name: ${task_name}
     save_dir: "${paths.output_dir}"
     offline: False
     id: null # pass correct id to resume experiment!
     anonymous: null # enable anonymous logging
     project: bird
     log_model: False # upload lightning ckpts
     prefix: "" # a string to put at the beginning of metric keys
     entity: u3006612
     group: ""
     tags: []
     job_type: ""
     resume: allow


model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: null     # or any directory you prefer
  filename: "epoch={epoch}-valmeta={val_closed/ADE:.4f}"
  monitor: "val_closed/ADE"   # <== key metric from validation
  verbose: false
  save_last: true
  save_top_k: 8
  mode: "max"                          # "max" since your metric increases with performance
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: false       # <== important, disables save after training epoch

#action: validate
#action: finetune
