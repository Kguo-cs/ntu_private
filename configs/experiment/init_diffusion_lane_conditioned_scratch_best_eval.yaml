# @package _global_
# Evaluate the geo_mse32_col20_heading_l1_shape2 native recipe on all 50000 matched-reference scenes.
# Pass ckpt_path=/path/to/checkpoint.ckpt (required); saved normalizer buffers override initialization.
# A required interpolation prevents inherited null from silently evaluating random weights.
# Use a declared checkpoint milestone; the larger overlapping set does not reselect the loss recipe.
defaults:
- init_diffusion_lane_conditioned_scratch_best
- _self_
task_name: init_diffusion_lane_conditioned_scratch_best_eval
action: test
ckpt_path: ${oc.env:INIT_DIFFUSION_SCRATCH_BEST_CKPT}
seed: 2817
model:
  model_config:
    sd_reference_mode: matched
    sd_require_full_set: true
    sd_expected_scenes: 50000
    decoder:
      init_diffusion:
        normalizer_path: null
data:
  scenario_dreamer_eval_set: null
trainer:
  limit_test_batches: 1.0
  logger: false
callbacks: null
