# @package _global_
# RoadK8 training recipe, with midpoint validation:12 intervals /24 model calls.
# Final roadK8 weights reached all7 targets in GEN3817; GEN2817 angle still fails.
# Training architecture, objective, optimizer and frozen map recipe are inherited.
defaults:
  - init_diffusion_657_n20_road_k8_full
  - _self_

task_name: init_diffusion_657_n24_road_k8_midpoint_full
float32_matmul_precision: highest
model:
  model_config:
    decoder:
      init_diffusion:
        sampling_integrator: midpoint
        sampling_steps: 12
        sampling_time_grid:
          kind: power
          power: 1.2
          terminal_time: 0.1
