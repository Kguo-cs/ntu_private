# @package _global_

defaults:
  - override /model: smart_fast

model:
  model_config:
    token_processor:
      pred_init: True
      learn_init: True

    decoder:
      pl2pl_radius: 300
      pl2a_radius: 300
      a2a_radius: 300

task_name: bc_init64_n20_r300

trainer:
  check_val_every_n_epoch: 2
  max_epochs: 32

data:
  train_batch_size: 64
  val_batch_size: 256