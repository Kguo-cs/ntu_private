# @package _global_
# Baseline for the fixed pretrained-map search; this is not the final search winner.
# Load only AIRL map weights. G1, Adam, epoch scheduler and EMA start fresh.
defaults:
  - init_diffusion_lane_conditioned_scratch_best
  - _self_

task_name: init_diffusion_lane_conditioned_frozen_map
action: fit
ckpt_path: null
seed: 817

model:
  model_config:
    initial_map_checkpoint: ${paths.root_dir}/waymo_data/AIRL32_interdis_mean_203_disnodiff_nonego_epoch=9-step=152190_0.79036.ckpt
    finetune: true
    decoder:
      sep_map: false
    sd_reference_mode: matched
    sd_require_full_set: false

data:
  train_batch_size: 512
  val_batch_size: 256
  test_batch_size: 128
  train_raw_dir: ${paths.cache_root}/training_map2_sd
  val_raw_dir: ${paths.cache_root}/scenario_dreamer_val
  test_raw_dir: ${paths.cache_root}/scenario_dreamer_val
  val_tfrecords_splitted: null
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  shuffle: true
  scenario_dreamer_train_sample_list: ${paths.cache_root}/training_map2_sd_files.pkl
  scenario_dreamer_eval_set: ${sim_root:}/docs/experiments/init_diffusion_frozen_map_search_20261011/confirmation4096_files.pkl
  scenario_dreamer_preprocessed: false
  scenario_dreamer_train_non_partitioned_only: false
  scenario_dreamer_train_latent_cache: null
  scenario_dreamer_val_latent_cache: null
  scenario_dreamer_test_latent_cache: null

trainer:
  accelerator: gpu
  devices: 1
  precision: 32-true
  max_epochs: 128
  max_steps: -1
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 4

callbacks:
  model_checkpoint:
    monitor: null
    save_top_k: -1
    save_last: false
    every_n_epochs: 4
    every_n_train_steps: null
    train_time_interval: null
    save_on_train_epoch_end: true
    save_weights_only: false
    auto_insert_metric_name: false
    filename: init-diffusion-frozen-map-{epoch}-{step}
  latest_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: null
    monitor: null
    save_top_k: 0
    save_last: true
    every_n_epochs: 1
    every_n_train_steps: null
    train_time_interval: null
    save_on_train_epoch_end: true
    save_weights_only: false
    auto_insert_metric_name: false
    filename: init-diffusion-frozen-map-latest-{epoch}-{step}
