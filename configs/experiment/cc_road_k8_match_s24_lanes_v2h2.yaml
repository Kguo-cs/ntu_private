# instead of converging (no-lanes runs reach ~.02/.05 by epoch 55); see wandb 0ub06wyq.
# cc_road_k8_match_s24 + lane centre-line context (ang/lat) + milder speed/heading matching
# {velocity: 2, heading: 2} (length). Evidence: 16-epoch scratch proxy lanes vs control:
# ang -46%, lat -71%, length +2%, speed +16%; full run efzhwmu3 (v2h2) vs nnsjk5vl at
# epochs 47-55: length -10..-13%, lat -35%, ang ~equal, speed +3..9%.
defaults:
  - cc_road_k8_match_s24_lanes
  - _self_

task_name: cc_road_k8_match_s24_lanes_v2h2

model:
  model_config:
    decoder:
      init_diffusion:
        matching_weights: {velocity: 2.0, heading: 2.0}
