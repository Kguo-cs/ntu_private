# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    n_vis_batch: 0
    n_vis_scenario: 0
    n_vis_rollout: 0
    n_batch_wosac_metric: 0
    val_open_loop: false
    val_closed_loop: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 #2048 #48 # for k most likely
      temp: 1.0
    wosac_submission:
      is_active: true
      method_name: "SMART-micro-DecompGAIL"
      authors: Ke Guo
      affiliation: ntu
      description: Learning Realistic Traffic Behaviors with Decomposed Multi-Agent Generative Adversarial Imitation Learning
      method_link: anonymous
      account_name: anonymous

    finetune: true
    smart : false
    decoder:
      hist_drop_prob: 0.1 #0.1 #0.1
      hidden_dim: 64
      num_freq_bands: 32
      num_heads: 8
      head_dim: 8
      num_agent_layers: 1


ckpt_path: './ckpts/bc40_apt30_tokenexitpred1_14679_1m_epoch=21-step=167420_0.76834.ckpt'

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  check_val_every_n_epoch: 1

data:
  train_batch_size: 2
  val_batch_size: 128
  test_batch_size: 128
  num_workers: 32
  shuffle: false
  pin_memory: false

action: test