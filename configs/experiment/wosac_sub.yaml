# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart_iq

model:
  model_config:
    n_vis_batch: 0
    n_vis_scenario: 0
    n_vis_rollout: 0
    n_batch_wosac_metric: 0
    val_open_loop: false
    val_closed_loop: true
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 2048 #2048 #48 # for k most likely
      temp: 1.0
    wosac_submission:
      is_active: true
      method_name: "sim"
      authors: ke
      affiliation: ntu
      description: ntu
      method_link: ntu
      account_name: ntu

