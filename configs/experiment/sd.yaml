# @package _global_

defaults:
  - scenario_dreamer
  - _self_

model:
  model_config:
#    lr: 1e-4
#    lr_min_ratio: 0.05
    token_processor:
      pred_init: True
      learn_init: True

    finetune: true
    #n_batch_wosac_metric: 0
    decoder:
      init_decoder: scenario_dreamer

#ckpt_path: './waymo_data/AIRL32_interdis_mean_203_disnodiff_nonego_epoch=9-step=152190_0.79036.ckpt'
ckpt_path: null  # Official AE/LDM weights are configured by scenario_dreamer.
#ckpt_path: "./waymo_data/last.ckpt"

task_name: scenario_dreamer

trainer:
  #check_val_every_n_epoch: 8
  limit_val_batches: 1 #.0 #.0 #.0
  val_check_interval: 0.000002 #1.0
  max_epochs: 64

data:
  train_batch_size: 2
  val_batch_size: 4
#  train_raw_dir: ${paths.cache_root}/training_map2_init5v #_vel_t5 #init0_light #init0_light  #init10_inter
  train_raw_dir: ${paths.cache_root}/train
  val_raw_dir: ${paths.cache_root}/test
#
  # num_workers: 1

action: finetune
