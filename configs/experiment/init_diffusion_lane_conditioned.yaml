# @package _global_
# Train the existing InitDiffusion on SMART map tokens; evaluate initial agents
# against the official full reference lanes using the Scenario Dreamer metrics.
defaults:
  - init_bc
  - _self_

action: finetune
task_name: xflow40_medium1e4
ckpt_path: ${paths.root_dir}/waymo_data/AIRL32_interdis_mean_203_disnodiff_nonego_epoch=9-step=152190_0.79036.ckpt
float32_matmul_precision: medium

model:
  lr: 0.0001
  model_config:
    token_processor:
      pred_init: true
      learn_init: true
      scenario_dreamer_init: true  # Use the identified scene's instantaneous state.
    decoder:
      init_decoder: flow  # Existing InitDiffusion, with the existing loss/sampler.
      initial_scene_only: true
    sd_use_cached_evaluator: true
    sd_eval_set: ${paths.root_dir}/waymo_data/waymo_eval_set.pkl
    sd_real_cache: ${paths.root_dir}/waymo_data/sd_real_metric_cache.sqlite
    sd_expected_scenes: 50000
    sd_gen_timestep: 0
    sd_prediction_frame: world
    sd_require_generation_timestep: true
    sd_reference_mode: full
    sd_require_full_set: false  # One monitoring batch; full evaluation below.

data:
  train_raw_dir: ${paths.cache_root}/training_map2_sd
  val_raw_dir: ${paths.cache_root}/scenario_dreamer_val
  test_raw_dir: ${paths.cache_root}/scenario_dreamer_val
  val_tfrecords_splitted: null
  train_batch_size: 40
  val_batch_size: 256
  test_batch_size: 256
  num_workers: 8
  pin_memory: false
  scenario_dreamer_preprocessed: false
  scenario_dreamer_train_non_partitioned_only: false
#  scenario_dreamer_train_sample_list: ${paths.cache_root}/training_map2_sd_files.pkl
  scenario_dreamer_eval_set: null  # Rebuilt .pt names differ from official .pkl names.
  scenario_dreamer_train_latent_cache: null
  scenario_dreamer_val_latent_cache: null
  scenario_dreamer_test_latent_cache: null

trainer:
  devices: 1
  max_epochs: 64
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  limit_val_batches: 1
  num_sanity_val_steps: 0

callbacks:
  model_checkpoint:
    monitor: collision_rate
    mode: min
    filename: init_diffusion-{epoch}-{step}
  model_summary:
    max_depth: 2
