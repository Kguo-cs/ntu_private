# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: waymo
  - model: smart
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: iq #_val #iq #ego_gmm_pre_bc  #wosac_sub #iq #iq

action: fit # fit, finetune, validate, test

# task name, determines output directory path
task_name: GAIL64_normR_novalue_4097 #bc64_map2_9_pt30 #GAIL64_map2_9_normR_novalue #_nomapshare_roll2 #bc60_map4_9 #GAIL64_map5_11_normR_novalue_nomapshare_roll2 #bc64_map5_11   #nospeedbump #GAIL64_edge10_airl #_nonorm #bc64_map10_s4 #GAIL64_edge10_airl_nonorm #bc64_map10_s4 #GAIL64_edge10_airlnormalize_novalue #detachvalue_airl #_noise00501s4 #_2048 #_learnvalue  | 637/1000

# simply provide checkpoint path to resume training
ckpt_path: null
train_log_dir: null

# seed for random number generators in pytorch, numpy and python.random
seed: 817

cfg: null
