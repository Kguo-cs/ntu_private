# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: waymo
  - model: smart
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: iq_finetune #wosac_sub #iq_finetune #wosac_sub #iq_finetune #wosac_sub #_val #iq #ego_gmm_pre_bc  #wosac_sub #iq #iq

action: fit # fit, finetune, validate, test

# task name, determines output directory path
task_name: AIRL64_finenotoken_disnot_a20_novalue #bc32_l3_mapa_histdrop01_a20 #AIRL64_finenotoken_density01 #_w1000 #_disnot_hist01 #bc32_l3_adamw_histdrop01_a20  #AIRL64_finenotoken_disnot_pre8_w1000

# simply provide checkpoint path to resume training
ckpt_path: null
train_log_dir: null

# seed for random number generators in pytorch, numpy and python.random
seed: 817

cfg: null
