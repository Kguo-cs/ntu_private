# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: waymo
  - model: smart
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: iq_finetune #iq_finetune #wosac_sub #iq_finetune #wosac_sub #_val #iq #ego_gmm_pre_bc  #wosac_sub #iq #iq

action: fit # fit, finetune, validate, test

# task name, determines output directory path
task_name: AIRL64_l3_noRnorm_fineall #_dropout01bc32_l3_adamw_histdrop01 #AIRL64_map2_03_l2_finetune_not #bc128_l3_adamw #discon #_a12_expertnoise001_alpha01 #AIRL48_map2_03_l2_finetune #

# simply provide checkpoint path to resume training
ckpt_path: null
train_log_dir: null

# seed for random number generators in pytorch, numpy and python.random
seed: 817

cfg: null
