# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: waymo
  - model: smart
  - callbacks: default
  - logger: wandb
  - trainer: default
  - paths: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: iq_finetune #iq_finetune  #wosac_sub

action: fit # fit, finetune, validate, test

# task name, determines output directory path
task_name: AIRL128_disnot #_runningreward99 #_d30 #syskl #density1 #_edge #bc32_l3_adamw_nonedge #AIRL64_disnotSA_clip #novalue #_entropy01 #bc32_l3_adamw #AIRL64_disnot_novalue_entropy01 #bc32_l3_adamw_histdrop01_apt15 #AIRL64_disnot_novalue_entropy01 #targetcritic #bc32_l3_adamw_histdrop01_a25pt15 #AIRL128_disnot_a20_novalue

# simply provide checkpoint path to resume training
ckpt_path: null
train_log_dir: null

# seed for random number generators in pytorch, numpy and python.random
seed: 817

cfg: null
