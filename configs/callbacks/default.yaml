model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint

  dirpath: ${paths.output_dir}/checkpoints

  # step 必须保留，否则同一个 epoch 内多次 validation 时文件名会重复
  filename: "epoch={epoch}-step={step}-valmeta={val_closed/wosac_likelihood/metametric:.4f}"

  monitor: "val_closed/wosac_likelihood/metametric"
  mode: "max"

  verbose: true
  save_last: true

  # 保存每一次 validation 对应的 checkpoint，不仅保留 Top-K
  save_top_k: 3

  auto_insert_metric_name: false
  save_weights_only: false

  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: 1

  # validation 结束时保存
  save_on_train_epoch_end: false

model_summary:
  max_depth: -1
