# @package _global_

defaults:
  # - override /trainer: ddp
  - override /model: smart

model:
  model_config:
    lr: 5e-4
    lr_min_ratio: 1e-2
    token_processor:
      map_token_sampling: # open-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0 # uniform sampling
      agent_token_sampling: # closed-loop
        num_k: 1 # for k nearest neighbors
        temp: 1.0
    validation_rollout_sampling:
      criterium: topk_prob
      num_k: 48 # for k most likely
      temp: 1.0
    val_open_loop: false

ckpt_path: '~/sim/smart/src/logs/debug_open_source/runs/2025-09-18_08-07-43/bc/hr9qr2kg/checkpoints/epoch=3-step=121752.ckpt'
# ckpt_path: CKPT_FOR_RESUME.ckpt # to resume training

trainer:
  limit_train_batches: 1.0
  limit_val_batches: 1
  check_val_every_n_epoch: 1
 # val_check_interval: 0.00002
  max_epochs: 32

data:
  train_batch_size: 5
  val_batch_size: 32
  test_batch_size: 10
  num_workers: 32