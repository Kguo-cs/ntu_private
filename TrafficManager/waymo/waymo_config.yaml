# Server Configuration
servers:
  diffusion: "http://127.0.0.1:11002/"
  driver: "http://127.0.0.1:11003/"

# Simulation Configuration
simulation:
  ego_id: '283'
  step_length: 0.1
  gui_display: true
  max_sim_time: 100.0
  use_agent_path: true # false for open-loop, true for closed-loop

# Map Configuration
map:
  name: 'boston-seaport'
  gen_description: 'daytime, cloudy, downtown, red buildings, white cars'
  sumo_cfg_file: "networkFiles/{map_name}/osm.sumocfg"
  sumo_net_file: "networkFiles/{map_name}/osm.net.xml"
  sumo_rou_file: "networkFiles/{map_name}/osm.rou.xml"

# Data Configuration
data:
  template_path: "data/data_template.pth"
  nu_scenes_root: "networkFiles/{map_name}/"

# Image Configuration
image:
  size: 200
  target_size: [560, 315] #[767, 576] #, 767


data_path: "../src/waymo_data/full/validation_tfrecords_splitted"

planner_path: "../src/waymo_data/epoch=3-step=30440-val_closed_wosac=0.7671.ckpt"