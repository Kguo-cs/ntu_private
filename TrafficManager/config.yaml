# Image Configuration
image:
  size: 200
  target_size: [560, 315]


data_path: "./waymo/desay_map" #"./waymo/desay_map"

planner_path: "/home/ke/code/catk/src/waymo_data/epoch=13-step=44856.ckpt"

camera_parameter_path: "./waymo/sensor_json/calibrated_sensors.json"

output_json_path: "./waymo/json_output/labels_occluded.json"

input_json_path: #"./waymo/json_input/static_ego.json"  #edit ego (or other) agent behavior like static_ego.json

gui_display: False

gui_show_static_id: False

lidar_height: 1.84

export_mode: "all" #  "agent"  -> 仅导出交通参与者 ,"all"          -> 导出交通参与者 + 静态障碍物 + 交通灯

max_sim_time: 90 #9s

random_seed: 3

agent_density: 0.5 #0 : no agent , 1: max number agent

agent_class_ratio:
  pedestrian: 1
  car: 8
  truck: 2
  bicycle: 1

agent_size:
  pedestrian: [0.8, 0.8, 1.7]
  bicycle: [1.8, 0.8, 1.7]
  car: [4.8, 2, 1.7]
  truck: [8.0, 2.5, 3.6]
  ego: [4.8, 2, 1.7]

static_density: 0.5 #0 : no agent , 1: max number agent

static_class_ratio:
  cone: 1
  water_barrier: 2
  hydrant: 1

static_size:
  cone: [0.5, 0.5, 1]
  water_barrier: [4, 0.5, 1]
  hydrant: [0.5, 0.5, 1]


