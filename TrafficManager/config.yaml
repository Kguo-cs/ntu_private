# Data Configuration
data:
  template_path: "data/data_template.pth"

# Image Configuration
image:
  size: 200
  target_size: [560, 315]


data_path: "./waymo/waymo_data"

planner_path: "./waymo/model_checkpoint/epoch=4-step=33820-val_closed_wosac=0.7650.ckpt"

camera_parameter_path: "./waymo/sensor_json/calibrated_sensors.json"

output_json_path: "./waymo/json_output/labels_occluded.json"

input_json_path: "./waymo/json_input/agent.json"  #edit ego (or other) agent behavior like static_ego.json

gui_display: true

lidar_height: 1.84



static_object:
  add: #static object
    - position: [362,6300]
      heading: 0
      shape: [10,10,1] #length,width,height

#    - position: [ 362,3600 ]#增加多个物体
#      heading: 0
#      shape: [ 10,10,1 ] #length,width,height


map_object:
  add: #static object
    - polygon_type: road_edge #_polygon_types = ["lane", "road_edge", "road_line", "crosswalk"]
      polyline_type: 4
      # polyline_type = {
      #     # for lane
      #     "TYPE_FREEWAY": 0,
      #     "TYPE_SURFACE_STREET": 1,
      #     "TYPE_STOP_SIGN": 2,
      #     "TYPE_BIKE_LANE": 3,
      #     # for roadedge
      #     "TYPE_ROAD_EDGE_BOUNDARY": 4,
      #     "TYPE_ROAD_EDGE_MEDIAN": 5,
      #     # for roadline
      #     "BROKEN": 6,
      #     "SOLID_SINGLE": 7,
      #     "DOUBLE": 8,
      #     # for crosswalk, speed bump and drive way
      #     "TYPE_CROSSWALK": 9,
      # }
      points:
        - [370, 6270]
        - [370, 6275]
        - [370, 6280]
        - [370, 6290]
      id: -100

  remove:
    - id: 984



agent:
  add:
    - type: 1 #{0: "vehicle", 1: "pedestrian", 2: "cyclist"}
      position: [360,6270]
      velocity: [-2,0]
      shape: [1,1,1]
      id: 0

  remove:
    - id: 997 # give the remove agent id

  stop:
    - id: 997 # give the remove agent id

  recording:
    - id: 997 # give the remove agent id

traffic_light: #特别属性包含灯的颜色，类别组合(圆形，向左向右箭头，掉头箭头等)，竖向横向。
  vertical:
    - lights:
        - [red, circle]
        - [yellow, left]
        - [green, right]
      position: [350, 6270]
      #light_types = {
      #            "circle": "O",
