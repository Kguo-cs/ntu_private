traffic_lights:
  - position:  [20, 200]    # 信号灯的世界坐标
    heading: 0
    size: [1,1,5]
    orientation: "vertical"         # vertical | horizontal
    type:                           # 灯泡组合类型 #color: red, yellow, green # shape: circle, left_arrow,right_arrow,forward_arrow,uturn
      - color: "red"
        shape: "left_arrow"
      - color: "yellow"
        shape: "circle"
      - color: "green"
        shape: "circle"
    mode: "custom"                # fixed | periodic | custom
    custom_logic:                  # 可扩展自定义控制逻辑
      script_path: "custom_logic.py"              # 指向外部 Python 文件（可选）
