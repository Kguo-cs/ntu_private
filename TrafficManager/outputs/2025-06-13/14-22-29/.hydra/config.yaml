_target_: src.smart.model.smart_gail.SMART_IQ
model_config:
  lr: 0.0005
  lr_warmup_steps: 0
  lr_total_steps: ${trainer.max_epochs}
  lr_min_ratio: 0.05
  n_rollout_closed_val: 32
  n_batch_wosac_metric: 1
  n_vis_batch: 0
  n_vis_scenario: 1
  n_vis_rollout: 1
  val_open_loop: true
  val_closed_loop: true
  token_processor:
    map_token_file: map_traj_token5.pkl
    agent_token_file: agent_vocab_555_s2.pkl
    map_token_sampling:
      num_k: 1
      temp: 1.0
    agent_token_sampling:
      num_k: 1
      temp: 1.0
  validation_rollout_sampling:
    criterium: topk_prob
    num_k: 5
    temp: 1.0
  training_rollout_sampling:
    criterium: topk_prob
    num_k: -1
    temp: 1.0
  decoder:
    hidden_dim: 128
    num_freq_bands: 64
    num_heads: 8
    head_dim: 16
    dropout: 0
    hist_drop_prob: 0
    num_map_layers: 1
    num_agent_layers: 1
    pl2pl_radius: 20
    pl2a_radius: 40
    a2a_radius: 60
    time_span: 30
    num_historical_steps: 11
    num_future_steps: 80
    pt2pt_neighbor: 10
    pt2a_neighbor: 8
    a2a_neighbor: 10
  wosac_submission:
    is_active: false
    method_name: SMART-tiny-CLSFT
    authors:
    - Anonymous
    affiliation: YOUR_AFFILIATION
    description: YOUR_DESCRIPTION
    method_link: YOUR_METHOD_LINK
    account_name: YOUR_ACCOUNT_NAME
  training_loss:
    use_gt_raw: true
    gt_thresh_scale_length: -1.0
    label_smoothing: 0.1
    rollout_as_gt: false
  finetune: false
